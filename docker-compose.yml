# docker-compose para controlbio-ponto
# Sobe a aplicação Next.js + banco PostgreSQL + migrações.
#
#   docker compose up -d --build     # build + sobe banco, migra e sobe a app
#   docker compose up -d db          # sobe só o banco (dev local com `npm run dev`)
#   ./seed.sh -n "Admin" -u admin -p senhaForte   # cria o admin inicial (1x)
#   docker compose logs -f app       # acompanha a app
#   docker compose down              # derruba (mantém o volume/dados)
#   docker compose down -v           # derruba e APAGA os dados do banco
#
# Os valores de ${...} vêm do arquivo .env no diretório do projeto.

services:
  db:
    # Versão pinada de propósito: `postgres:latest` pula de major sozinho
    # (ex.: 18 mudou o layout do diretório de dados) e quebra volumes existentes.
    image: postgres:18
    container_name: controlbio-ponto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-controlbio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controlbio}
      POSTGRES_DB: ${POSTGRES_DB:-controlbio_ponto}
    # Porta exposta SÓ no localhost da VPS (não na internet). A app fala com o
    # banco pela rede interna do compose (host "db"), sem precisar dessa porta.
    # Para acesso externo (ex.: Drizzle Studio via túnel SSH), use 127.0.0.1.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18+ guarda os dados num subdiretório por major dentro de
      # /var/lib/postgresql — por isso o mount é no diretório pai (não em /data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-controlbio} -d ${POSTGRES_DB:-controlbio_ponto}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Migrações: serviço de uso único (stage `tools`, tem drizzle-kit/tsx). Roda e
  # encerra. O `up` espera ele concluir antes de subir a app. É idempotente.
  # O mesmo serviço é reaproveitado pelo seed.sh (com o comando sobrescrito).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    container_name: controlbio-ponto-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Host "db" = nome do serviço acima (rede interna do compose). SEM
      # `?schema=public` (sintaxe do Prisma) — o postgres-js rejeita.
      DATABASE_URL: postgresql://${POSTGRES_USER:-controlbio}:${POSTGRES_PASSWORD:-controlbio}@db:5432/${POSTGRES_DB:-controlbio_ponto}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: controlbio-ponto-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-controlbio}:${POSTGRES_PASSWORD:-controlbio}@db:5432/${POSTGRES_DB:-controlbio_ponto}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-28800}
      # Servindo HTTP direto (sem TLS): o cookie de sessão NÃO pode ser Secure,
      # senão o login não funciona. ⚠️ Sem HTTPS, senha/sessão trafegam em texto
      # puro — coloque um proxy TLS (Caddy/nginx) na frente assim que possível.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Integração ClickUp (spec 011) — quem PROCESSA a fila de sincronização
      # (criar tarefa, comentar, lançar tempo) é só o serviço `worker`, abaixo.
      # Mas a app TAMBÉM fala com a API, direto, em dois lugares próprios: as
      # telas de configuração do admin (`/integracao`, pickers de Space/Folder/
      # Lista/status) e o gatilho eager de "iniciar cronômetro" (RF-21, marca a
      # tarefa em andamento na hora, sem esperar o worker) — por isso as mesmas
      # credenciais são passadas aqui também, não só no `worker`.
      CLICKUP_API_TOKEN: ${CLICKUP_API_TOKEN:-}
      CLICKUP_TEAM_ID: ${CLICKUP_TEAM_ID:-}
      CLICKUP_TOKEN_ENC_KEY: ${CLICKUP_TOKEN_ENC_KEY:-}
      CLICKUP_RATE_LIMIT_PER_MIN: ${CLICKUP_RATE_LIMIT_PER_MIN:-90}
    ports:
      - "${APP_PORT:-3000}:3000"

  # Worker da integração com o ClickUp (spec 011). Consome `clickup_sync_jobs`.
  # Usa o estágio `tools` porque precisa de tsx + código-fonte (o `runner` só tem
  # o build standalone da app). Sem CLICKUP_API_TOKEN ele encerra sozinho.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    container_name: controlbio-ponto-worker
    restart: unless-stopped
    # A carência padrão do Docker é 10s — curta demais: o worker só encerra na
    # FRONTEIRA entre jobs (nunca no meio de um, para não duplicar comentário ou
    # lançamento de tempo no retry — RN-13), e um job custa de 3 a 7 requisições
    # no teto de 90/min. Com 10s, o `docker compose down`/`restart` viraria
    # SIGKILL no meio do job, deixando-o preso em `running` (recuperado só
    # depois pela retomada de claim preso em `claimJobs`).
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "worker:clickup"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-controlbio}:${POSTGRES_PASSWORD:-controlbio}@db:5432/${POSTGRES_DB:-controlbio_ponto}
      CLICKUP_API_TOKEN: ${CLICKUP_API_TOKEN:-}
      CLICKUP_TEAM_ID: ${CLICKUP_TEAM_ID:-}
      CLICKUP_TOKEN_ENC_KEY: ${CLICKUP_TOKEN_ENC_KEY:-}
      CLICKUP_RATE_LIMIT_PER_MIN: ${CLICKUP_RATE_LIMIT_PER_MIN:-90}
      CLICKUP_WORKER_POLL_MS: ${CLICKUP_WORKER_POLL_MS:-5000}
      CLICKUP_MAX_ATTEMPTS: ${CLICKUP_MAX_ATTEMPTS:-5}

volumes:
  postgres_data: